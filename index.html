```html
<section class="booking" id="reservas">

  <div class="booking-container">

    <h2>RESERVA TU EXPERIENCIA</h2>

    <p>Selecciona la fecha y hora para tu próximo servicio.</p>

    <form id="booking-form">

      <div class="input-group">
        <label for="nombre">Nombre Completo</label>
        <input
          type="text"
          id="nombre"
          placeholder="Ej. Carlos Mendoza"
          required
        >
      </div>

      <div class="input-group">
        <label for="telefono">Teléfono / WhatsApp</label>
        <input
          type="tel"
          id="telefono"
          placeholder="+57 300 000 0000"
          required
        >
      </div>

      <div class="input-group">
        <label for="servicio">Servicio</label>

        <select id="servicio" required>

          <option value="" disabled selected>
            Selecciona un servicio
          </option>

          <option value="Corte Premium">
            Corte Premium
          </option>

          <option value="Barba Royal">
            Barba Royal
          </option>

          <option value="Combo Barber ATT The Best">
            Combo Barber ATT The Best
          </option>

        </select>
      </div>

      <div class="input-row">

        <div class="input-group">
          <label for="fecha">Fecha</label>

          <input
            type="date"
            id="fecha"
            required
          >
        </div>

        <div class="input-group">
          <label for="hora">Hora</label>

          <input
            type="time"
            id="hora"
            required
          >
        </div>

      </div>

      <button
        type="submit"
        class="btn-gold block"
      >
        Confirmar Reserva
      </button>

    </form>

  </div>

</section>


<!-- JavaScript -->
<script src="script.js"></script>

</body>
</html>
```
